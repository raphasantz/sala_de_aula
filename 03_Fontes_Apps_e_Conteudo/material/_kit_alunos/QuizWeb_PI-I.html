<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizWeb — Programação para Internet I</title>
<style>
  :root{
    --roxo:#46178f; --roxo2:#33106b; --fundo:#f2f2f9;
    --verm:#e21b3c; --azul:#1368ce; --amar:#ffa602; --verde:#26890c;
    --tinta:#201a35; --cinza:#6b6880; --branco:#fff;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
       background:var(--fundo); color:var(--tinta); min-height:100vh}
  .wrap{max-width:1000px; margin:0 auto; padding:18px 16px 40px}
  header.topo{background:var(--roxo); color:#fff; padding:16px 0 14px; text-align:center;
              box-shadow:0 3px 0 var(--roxo2)}
  header.topo h1{font-size:26px; letter-spacing:.5px}
  header.topo p{font-size:12.5px; opacity:.85; margin-top:2px}
  .card{background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 10px rgba(30,20,80,.08);
        margin-top:16px}
  h2.sec{font-size:19px; color:var(--roxo); margin:22px 4px 10px}
  .grid-modos{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:16px}
  .modo{border:none; border-radius:16px; padding:22px 18px; text-align:left; color:#fff; cursor:pointer;
        font-family:inherit; transition:transform .12s}
  .modo:hover{transform:translateY(-3px)}
  .modo h3{font-size:20px; margin-bottom:6px}
  .modo p{font-size:13px; opacity:.92; line-height:1.45}
  .modo.solo{background:linear-gradient(135deg,#7a2ff0,#46178f)}
  .modo.turma{background:linear-gradient(135deg,#e21b3c,#a3122b)}
  .modo.lista{background:linear-gradient(135deg,#1368ce,#0b4a94)}
  .linha{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0}
  .btn{border:none; border-radius:10px; padding:11px 20px; font-size:15px; font-weight:700;
       cursor:pointer; font-family:inherit; background:var(--roxo); color:#fff}
  .btn.secund{background:#e7e2f7; color:var(--roxo)}
  .btn.verde{background:var(--verde)}
  .btn.amarelo{background:var(--amar); color:#3a2700}
  .btn:disabled{opacity:.45; cursor:default}
  .item-lista{display:flex; justify-content:space-between; gap:10px; align-items:center;
              background:#fff; border:2px solid #eceaf6; border-radius:12px; padding:11px 14px;
              margin:7px 0; cursor:pointer; transition:border-color .12s}
  .item-lista:hover{border-color:var(--roxo)}
  .item-lista .tt{font-weight:700; font-size:14.5px}
  .item-lista .sub{font-size:12px; color:var(--cinza)}
  .badge{background:var(--roxo); color:#fff; font-size:11px; font-weight:700; border-radius:20px;
         padding:3px 10px; white-space:nowrap}
  .badge.rec{background:var(--verde)}
  /* ---- quiz ---- */
  .barra-topo{display:flex; justify-content:space-between; align-items:center; margin:14px 2px 10px;
              font-size:13.5px; font-weight:700; color:var(--cinza)}
  .timerbox{background:var(--roxo); color:#fff; border-radius:10px; padding:5px 14px; font-size:16px}
  .timerbar{height:8px; background:#e3e0f0; border-radius:6px; overflow:hidden; margin:6px 0 14px}
  .timerbar i{display:block; height:100%; background:var(--amar); width:100%; transition:width .25s linear}
  .pergunta{background:#fff; border-radius:16px; padding:22px 20px; font-size:21px; font-weight:700;
            line-height:1.35; box-shadow:0 2px 10px rgba(30,20,80,.08); min-height:96px}
  .opcoes{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
  @media(max-width:720px){.opcoes{grid-template-columns:1fr}}
  .op{border:none; border-radius:12px; padding:16px 16px 16px 58px; position:relative; color:#fff;
      font-size:16.5px; font-weight:600; text-align:left; cursor:pointer; font-family:inherit;
      line-height:1.3; min-height:64px}
  .op .forma{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:24px}
  .op.c0{background:var(--verm)} .op.c1{background:var(--azul)}
  .op.c2{background:var(--amar); color:#3a2700} .op.c3{background:var(--verde)}
  .op:disabled{cursor:default}
  .op.certa{outline:5px solid #0e5c00; outline-offset:-5px}
  .op.errada{outline:5px solid #7d0018; outline-offset:-5px; opacity:.85}
  .feedback{border-radius:14px; padding:16px 18px; margin-top:14px; color:#fff; font-size:15.5px}
  .feedback.ok{background:var(--verde)} .feedback.erro{background:var(--verm)}
  .feedback b{display:block; font-size:18px; margin-bottom:4px}
  .placar{display:flex; gap:16px; font-weight:800; font-size:15px; color:var(--roxo)}
  /* ---- turma ---- */
  .turma .pergunta{font-size:30px; padding:30px 26px}
  .turma .op{font-size:22px; min-height:84px; padding-left:66px}
  .turma .op .forma{font-size:30px}
  .times{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
  .time{background:#fff; border:3px solid var(--roxo); color:var(--roxo); border-radius:12px;
        padding:8px 16px; font-weight:800; cursor:pointer; font-size:16px; font-family:inherit}
  .time span{background:var(--roxo); color:#fff; border-radius:16px; padding:1px 10px; margin-left:8px}
  .time.lead{background:var(--amar); border-color:#b57500; color:#3a2700}
  .time.lead span{background:#3a2700}
  input[type=text]{width:100%; border:2px solid #d9d4ee; border-radius:10px; padding:11px 13px;
                   font-size:15px; font-family:inherit}
  .nota{font-size:12.5px; color:var(--cinza); margin-top:8px; line-height:1.5}
  .podio{ text-align:center; padding:10px 0 4px }
  .podio .p1{font-size:34px}
  .rev{background:#fff; border-radius:10px; padding:10px 13px; margin:7px 0; font-size:13.5px;
       border-left:6px solid #ccc}
  .rev.ok{border-color:var(--verde)} .rev.erro{border-color:var(--verm)}
  .rev b{font-size:14px}
  footer{ text-align:center; font-size:11.5px; color:var(--cinza); padding:18px 0 8px }

/* ---------- responsivo ---------- */
@media (max-width:760px){
  header{padding:10px 12px; flex-wrap:wrap; gap:8px}
  header h1{font-size:16px}
  .wrap{padding:12px 10px 50px}
  .grid-modos{grid-template-columns:1fr}
  .opcoes{grid-template-columns:1fr}
  .op{font-size:14.5px; min-height:52px; padding:12px 12px 12px 48px}
  .op .forma{font-size:18px; left:12px}
  .pergunta{font-size:17px}
  .modo h3{font-size:17px}
  .modo p{font-size:13px}
  .timerbox{font-size:14px; padding:4px 10px}
  .times{gap:6px}
  .time{font-size:13.5px; padding:6px 10px}
  .btn{padding:10px 16px; font-size:14px}
  .item-lista{padding:10px 12px}
}
</style>
</head>

<script>
const DATA = {"aulas": [{"n": 1, "mod": 1, "t": "O que é a Internet?", "qs": [["O que é uma rede de computadores?", ["Conjunto de dispositivos conectados que trocam informações", "Um único computador com muitos arquivos", "Um site de relacionamento entre computadores", "Um programa de editar textos"], 0, "Rede = dispositivos interligados para trocar dados; a Internet é uma rede mundial de redes."], ["Na Web, qual é o papel do navegador (Chrome, Firefox...)?", ["Servidor, pois guarda os sites", "Cliente, pois solicita páginas ao servidor", "DNS, pois traduz endereços", "Protocolo, pois define as regras"], 1, "O navegador é o software cliente: requisita e exibe a resposta do servidor."], ["Qual frase está correta?", ["Internet e Web são a mesma coisa", "A Web é um dos serviços que funcionam sobre a Internet", "A Internet é um site gigante", "A Web existe sem a Internet"], 1, "Internet = infraestrutura; Web = serviço de páginas (como e-mail e streaming são outros serviços)."]]}, {"n": 2, "mod": 1, "t": "Como a Web funciona?", "qs": [["Qual é a ordem do ciclo da Web?", ["Resposta → requisição → processamento", "Requisição do navegador → processamento no servidor → resposta", "Processamento no navegador → resposta do servidor", "DNS → resposta → requisição"], 1, "O navegador pede (requisição), o servidor processa e devolve (resposta) o HTML."], ["Em comparação com o HTTP, o HTTPS adiciona:", ["Criptografia na comunicação", "Mais cores às páginas", "Hospedagem gratuita", "Registro de domínio automático"], 0, "HTTPS = HTTP + criptografia; o cadeado indica conexão segura."], ["Na URL https://escola.edu.br/ava/login.php, qual é o DOMÍNIO?", ["https", "escola.edu.br", "/ava/", "login.php"], 1, "Domínio é o nome do site; /ava/ é caminho e login.php é o recurso."]]}, {"n": 3, "mod": 1, "t": "Domínio, hospedagem e servidor Web", "qs": [["A função do DNS é:", ["Hospedar os arquivos do site", "Traduzir o nome do domínio em endereço IP", "Criptografar senhas", "Exibir as páginas no navegador"], 1, "DNS é a 'agenda' da Internet: nome → IP."], ["O endereço IP identifica:", ["O formato dos arquivos", "Um dispositivo na rede, por meio de um número", "A cor do site", "A pasta do projeto"], 1, "IP é o 'número da casa' do dispositivo na rede."], ["Para deixar um site no ar 24h por dia, contratamos:", ["Um editor de código", "Um navegador pago", "Uma hospedagem", "Um teclado melhor"], 2, "Hospedagem = espaço em servidor ligado continuamente, com servidor Web."]]}, {"n": 4, "mod": 1, "t": "Portais, e-business e e-commerce", "qs": [["e-Commerce é:", ["A compra e venda on-line (loja virtual)", "O conjunto de processos internos da empresa", "Um portal de notícias", "Um protocolo de rede"], 0, "e-commerce = vendas on-line; faz parte do e-business."], ["Qual relação está correta?", ["e-business e e-commerce são sinônimos", "Todo e-commerce faz parte de um e-business", "e-business é só vendas", "e-commerce é maior que e-business"], 1, "e-business é o conceito amplo (negócio digital); e-commerce é a parte de vendas."], ["Ordem correta do fluxo de uma loja virtual:", ["Checkout → carrinho → catálogo → início", "Início → catálogo → ficha do produto → carrinho → checkout", "Carrinho → início → checkout → catálogo", "Catálogo → checkout → carrinho → início"], 1, "Fluxo clássico: início → catálogo → ficha → carrinho → checkout → confirmação."]]}, {"n": 5, "mod": 2, "t": "Ambiente de desenvolvimento", "qs": [["Qual ferramenta é a adequada para ESCREVER os arquivos do site?", ["Microsoft Word", "Editor de código (VS Code)", "Excel", "PowerPoint"], 1, "Código é texto puro: editor de código, nunca processadores de texto."], ["A página inicial de um site deve se chamar:", ["inicio2.html", "home-page.doc", "index.html", "principal.txt"], 2, "O servidor procura automaticamente index.html/index.php ao acessar o site."], ["No terminal, qual comando CRIA uma pasta?", ["cd", "dir", "del", "mkdir"], 3, "mkdir = make directory (criar pasta); cd navega, dir lista."]]}, {"n": 6, "mod": 3, "t": "Primeiro documento HTML", "qs": [["HTML é uma linguagem de:", ["Programação, com variáveis e decisões", "Marcação, que estrutura o conteúdo", "Banco de dados", "Sistema operacional"], 1, "HTML marca o conteúdo (título, parágrafo...); quem programa é o PHP."], ["O conteúdo VISÍVEL da página fica dentro de:", ["<head>", "<title>", "<body>", "<meta>"], 2, "body = corpo visível; head = configurações e metadados."], ["O texto que aparece na ABA do navegador é definido por:", ["<h1>", "<title>", "<p>", "<body>"], 1, "title (dentro do head) define o título da aba; h1 é o título na página."]]}, {"n": 7, "mod": 3, "t": "Estrutura do HTML", "qs": [["Um elemento HTML é formado por:", ["Somente texto", "Tag de abertura + conteúdo + tag de fechamento", "Apenas atributos", "Um comentário e uma imagem"], 1, "Ex.: <p>texto</p> — abertura, conteúdo, fechamento."], ["Qual elemento NÃO tem tag de fechamento?", ["<p>", "<h1>", "<br>", "<strong>"], 2, "br, hr, img, meta e input são elementos vazios."], ["Os atributos de um elemento são escritos:", ["Na tag de abertura, como nome=\"valor\"", "Dentro do fechamento", "Fora do elemento", "Sempre no <head>"], 0, "Atributos ficam na tag de abertura: <html lang=\"pt-br\">."]]}, {"n": 8, "mod": 3, "t": "Cabeçalhos e parágrafos", "qs": [["Qual tag representa o título PRINCIPAL da página?", ["<h6>", "<p>", "<title>", "<h1>"], 3, "h1 é o título principal (idealmente único por página)."], ["Para quebrar uma linha DENTRO do mesmo parágrafo usamos:", ["<hr>", "<br>", "<p>", "<h2>"], 1, "br = quebra de linha; hr = separador horizontal."], ["Qual elemento marca uma mudança de assunto com uma linha horizontal?", ["<br>", "<hr>", "<em>", "<li>"], 1, "hr desenha um separador horizontal entre blocos."]]}, {"n": 9, "mod": 3, "t": "Formatação de textos", "qs": [["Qual tag indica que o texto é IMPORTANTE (semântica)?", ["<b>", "<font>", "<strong>", "<span>"], 2, "strong transmite importância; b é apenas aparência."], ["A tag <mark> serve para:", ["Destacar/marcar um trecho", "Apagar texto", "Deixar em subscrito", "Criar um link"], 0, "mark exibe o texto destacado (fundo amarelo por padrão)."], ["Por que preferir <strong> a <b>?", ["Carrega mais rápido", "Muda a cor do texto", "Transmite significado a leitores de tela e buscadores", "É obrigatório pelo navegador"], 2, "Semântica ajuda acessibilidade (leitores de tela) e SEO."]]}, {"n": 10, "mod": 4, "t": "Links", "qs": [["Um link é criado com qual tag e atributo?", ["<img src>", "<a href>", "<p link>", "<table href>"], 1, "<a href=\"destino\">texto</a>."], ["Links INTERNOS (entre páginas do mesmo site) usam:", ["URL absoluta com https://", "Caminho relativo (ex.: sobre.html)", "O endereço IP do servidor", "O nome do provedor"], 1, "Interno = caminho relativo; externo = URL absoluta."], ["Para abrir o link em NOVA ABA usamos:", ["target=\"_blank\"", "href=\"_new\"", "rel=\"tab\"", "open=\"sim\""], 0, "target=\"_blank\" abre em nova aba/janela."]]}, {"n": 11, "mod": 4, "t": "Imagens", "qs": [["Qual elemento exibe uma imagem?", ["<image link>", "<a src>", "<img src alt>", "<foto>"], 2, "<img> é elemento vazio com src (arquivo) e alt (descrição)."], ["O atributo alt serve para:", ["Definir o tamanho da imagem", "Descrever a imagem (acessibilidade e falha de carregamento)", "Escolher o formato do arquivo", "Criar uma pasta de imagens"], 1, "alt é lido por leitores de tela e aparece se a imagem não carregar."], ["Qual formato é o mais indicado para imagens com FUNDO TRANSPARENTE?", ["JPEG", "PNG", "GIF de fotos", "BMP pesado"], 1, "PNG suporta transparência; JPEG é para fotos."]]}, {"n": 12, "mod": 4, "t": "Listas", "qs": [["Lista NÃO ordenada (a ordem não importa) usa:", ["<ol> e <li>", "<ul> e <li>", "<dl> e <dt>", "<table> e <tr>"], 1, "ul = unordered list, com marcadores."], ["Para passos de uma receita (ordem importa), usamos:", ["<ul>", "<dl>", "<ol>", "<li> solto"], 2, "ol numera os itens automaticamente."], ["A lista de DEFINIÇÃO (termo + significado) usa:", ["<dl>, <dt> e <dd>", "<ul> e <ol>", "<h1> e <p>", "<dt> e <ul>"], 0, "dl = definition list; dt = termo; dd = definição."]]}, {"n": 13, "mod": 5, "t": "Tabelas", "qs": [["Em uma tabela, cada LINHA é criada com:", ["<td>", "<tr>", "<th>", "<table>"], 1, "tr = table row (linha)."], ["A célula de CABEÇALHO (título de coluna) é:", ["<td>", "<caption>", "<th>", "<tr>"], 2, "th destaca (negrito/centrado por padrão)."], ["Toda célula (<td> ou <th>) precisa estar dentro de:", ["<table> diretamente", "<thead> apenas", "<tr>", "<tbody> apenas"], 2, "A ordem é sempre table → tr → th/td."]]}, {"n": 14, "mod": 5, "t": "Tabelas na prática", "qs": [["O atributo colspan=\"2\" faz a célula:", ["Ocupar 2 linhas", "Ocupar 2 colunas", "Criar 2 tabelas", "Ter borda dupla"], 1, "colspan mescla colunas; rowspan mescla linhas."], ["As seções cabeçalho, corpo e rodapé da tabela são:", ["head, body, foot", "thead, tbody, tfoot", "top, mid, bottom", "th, td, tr"], 1, "thead/tbody/tfoot organizam semanticamente a tabela."], ["Numa tabela de 3 colunas, uma linha com uma célula colspan=\"2\" deve ter, ao todo, quantas células?", ["3 células normais", "2 células (a de colspan conta por 2)", "4 células", "1 célula"], 1, "Some: colspan 2 + 1 célula = 3 colunas. Células 'engolidas' são removidas."]]}, {"n": 15, "mod": 5, "t": "Formulários", "qs": [["Qual atributo do campo é usado pelo PHP para ler o valor enviado?", ["id", "class", "name", "for"], 2, "name é a chave em $_POST/$_GET; id serve para label/CSS."], ["Para MÚLTIPLAS escolhas independentes (hobbies), usamos:", ["radio com mesmo name", "checkbox", "input date", "select obrigatório"], 1, "checkbox marca/desmarca opções independentes."], ["O <label for=\"x\"> deve casar com qual atributo do input?", ["name=\"x\"", "id=\"x\"", "value=\"x\"", "type=\"x\""], 1, "for aponta para o id do campo (clicar no label foca o campo)."]]}, {"n": 16, "mod": 5, "t": "Formulários na prática", "qs": [["Para campo de SENHA (caracteres ocultos), o type é: loja.com.br/produtos/fone.php?id=7, o trecho <b>produtos/fone.php</b> representa:", ["o protocolo da comunicação.", "o domínio registrado da loja.", "os parâmetros enviados ao servidor.", "o caminho e o recurso (página) solicitado."], 3, "Protocolo = https; domínio = loja.com.br; caminho/recurso = /produtos/fone.php; parâmetro = id=7."]]}, {"n": 2, "t": "Ferramentas de desenvolvimento", "qs": [["Qual ferramenta é a mais adequada para escrever os arquivos HTML e PHP do projeto?", ["Microsoft Word, por causa do corretor ortográfico.", "Um editor de código, como o VS Code.", "O Bloco de Notas do celular.", "O navegador Chrome."], 1, "Código é texto puro: editores de código oferecem cores de sintaxe e autocompletar sem inserir formatação invisível (como faz o Word)."], ["A página inicial de um site deve se chamar <b>index.html</b> (ou index.php) porque:", ["é uma regra gramatical da linguagem HTML.", "index significa ‘índice’ em latim e soa profissional.", "o servidor Web procura automaticamente esse arquivo ao acessar o site.", "o navegador não abre arquivos com outros nomes."], 2, "Ao receber um acesso sem página especificada, o servidor busca index.html/index.php na pasta do site."], ["No terminal, o comando <b>mkdir imagens</b> serve para:", ["abrir a pasta imagens no navegador.", "criar uma pasta chamada imagens.", "apagar a pasta imagens.", "listar os arquivos da pasta atual."], 1, "mkdir = make directory (criar diretório/pasta). Listar arquivos é dir (Windows) ou ls (Linux); navegar é cd."], ["Por que não se deve usar nomes de arquivo com acentos ou espaços (ex.: “Página Inicial.html”)?", ["Porque o VS Code não salva arquivos assim.", "Porque ocupam mais espaço em disco.", "Porque URLs e servidores tratam acentos/espaços de forma inconsistente, podendo quebrar os links.", "Porque o HTML proíbe letras maiúsculas."], 2, "Boa prática: nomes curtos, minúsculos, sem acento, separados por hífen ou sublinhado (ex.: pagina-inicial.html)."], ["As DevTools do navegador (tecla F12) permitem, entre outras coisas:", ["editar o código HTML exibido da página e ver as requisições de rede.", "criar novas pastas no projeto automaticamente.", "registrar domínios gratuitamente.", "traduzir o site para outro idioma."], 0, "As DevTools mostram o HTML recebido, permitem inspecionar elementos, ver a rede, o console e muito mais — são a principal ferramenta de teste do desenvolvedor."]]}, {"n": 3, "t": "HTML – fundamentos", "qs": [["A declaração <b>&lt;!DOCTYPE html&gt;</b> serve para:", ["criar o título da página.", "informar ao navegador que o documento usa HTML5.", "definir a codificação UTF-8.", "iniciar o corpo visível da página."], 1, "O DOCTYPE deve ser a primeira linha do arquivo e declara a versão do HTML (HTML5)."], ["As informações de configuração da página (charset, title) ficam dentro do elemento:", ["&lt;body&gt;", "&lt;head&gt;", "&lt;title&gt;", "&lt;meta&gt;"], 1, "O head guarda metadados e configurações; o body guarda o conteúdo visível. title e meta são filhos do head."], ["Qual grupo contém apenas elementos <b>vazios</b> (sem tag de fechamento)?", ["p, h1, strong", "br, hr, img", "a, em, mark", "title, meta, body"], 1, "br, hr, img (e também meta, input) não envolvem conteúdo — não têm fechamento."], ["Sobre cabeçalhos, é <b>correto</b> afirmar:", ["podemos usar quantos h1 quisermos por página.", "h6 é o título de maior destaque.", "o ideal é um único h1 por página, representando o assunto principal.", "cabeçalhos servem apenas para aumentar a fonte do texto."], 2, "h1 é o título principal (único por página); h2..h6 organizam seções em ordem hierárquica — não são apenas tamanhos de fonte."], ["A diferença entre <b>&lt;strong&gt;</b> e <b>&lt;b&gt;</b> é que:", ["strong deixa itálico e b deixa negrito.", "strong transmite importância (semântica); b apenas altera a aparência.", "b é uma tag obsoleta que quebra a página.", "não existe diferença: são sinônimos perfeitos."], 1, "Ambos exibem negrito, mas strong tem significado (importância) — usado por leitores de tela e buscadores."]]}, {"n": 4, "t": "HTML – conteúdo", "qs": [["Para criar um link que abre a página sobre.html do próprio site, usamos:", ["&lt;link src=\"sobre.html\"&gt;", "&lt;a href=\"sobre.html\"&gt;Sobre&lt;/a&gt;", "&lt;a src=\"https://sobre.html\"&gt;Sobre&lt;/a&gt;", "&lt;href a=\"sobre.html\"&gt;Sobre&lt;/href&gt;"], 1, "Link interno usa a tag a com href e caminho relativo — sem https://."], ["O atributo <b>target=\"_blank\"</b> faz o link:", ["abrir em uma nova aba/janela.", "ficar em negrito.", "abrir apenas se o site for HTTPS.", "ser invisível na página."], 0, "_blank = nova aba. Sem target, o link abre na mesma aba (comportamento padrão)."], ["Uma página em <b>pages/noticia.html</b> quer exibir <b>imagens/foto.jpg</b> (pasta imagens/ na raiz do projeto). O src correto é:", ["imagens/foto.jpg", "pages/imagens/foto.jpg", "../imagens/foto.jpg", "/foto.jpg"], 2, "É preciso 'subir' um nível (..) a partir de pages/ para alcançar a pasta imagens/ da raiz."], ["A função do atributo <b>alt</b> em uma imagem é:", ["definir o tamanho da imagem na tela.", "descrever a imagem para acessibilidade e para quando ela não carregar.", "criar um link ao clicar na imagem.", "indicar o formato do arquivo (jpg, png...)."], 1, "alt = texto alternativo: lido por leitores de tela, exibido se a imagem falhar e usado por buscadores."], ["Para exibir os passos de uma receita, em que a <b>ordem importa</b>, o tipo de lista adequado é:", ["ul — não ordenada, com marcadores.", "ol — ordenada, com numeração automática.", "dl — lista de definição.", "table — tabela de passos."], 1, "ol numera os itens automaticamente (1, 2, 3...) — ideal para sequências e rankings."]]}, {"n": 5, "t": "HTML – tabelas e formulários", "qs": [["Em uma tabela HTML, a diferença entre th e td é:", ["th é célula de dado; td é célula de cabeçalho.", "th é célula de cabeçalho (destacada); td é célula de dado.", "th só pode ser usado no tfoot.", "não há diferença: são sinônimos."], 1, "th marca cabeçalhos de coluna/linha (negrito, centralizado por padrão); td marca dados."], ["O atributo <b>colspan=\"3\"</b> em uma célula faz com que ela:", ["seja repetida em 3 linhas.", "ocupe o espaço de 3 colunas.", "tenha 3 pixels de borda.", "exiba 3 textos diferentes."], 1, "colspan mescla colunas (a célula ocupa 3); rowspan mesclaria linhas."], ["Em um formulário, o atributo <b>label for=\"nome\"</b> deve casar com qual atributo do input?", ["name=\"nome\"", "id=\"nome\"", "value=\"nome\"", "type=\"nome\""], 1, "O for do label aponta para o id do campo. O name serve para o envio ao servidor — são funções diferentes."], ["Para o usuário escolher <b>apenas uma</b> opção entre “Manhã, Tarde ou Noite”, o campo adequado é:", ["3 checkboxes com names diferentes.", "3 inputs type=\"radio\" com o mesmo name.", "3 inputs type=\"text\".", "1 textarea listando as opções."], 1, "Radios com o MESMO name formam um grupo de escolha única. Checkboxes permitem múltiplas escolhas."], ["No form, os atributos <b>action</b> e <b>method</b> definem, respectivamente:", ["o estilo do formulário e a cor do botão.", "o arquivo que processará os dados e o modo de envio (get/post).", "o título da página e o idioma.", "quais campos são obrigatórios e seus tipos."], 1, "action = destino do processamento (ex.: processar.php); method = forma de envio dos dados (GET ou POST — módulo 11)."]]}, {"n": 6, "t": "Introdução ao PHP", "qs": [["O código PHP é executado:", ["no navegador do usuário.", "no servidor Web, antes de a página ser enviada.", "no editor de código, ao salvar o arquivo.", "no sistema DNS."], 1, "PHP é server-side: o servidor executa e envia ao navegador apenas o HTML resultante."], ["O comando usado para exibir conteúdo na página em PHP é:", ["print-screen", "echo", "display", "show"], 1, "echo (e seu primo print) envia conteúdo para a resposta da página."], ["Um arquivo com PHP deve ter qual extensão e como deve ser acessado?", [".html, com dois cliques no arquivo.", ".php, pelo endereço http://localhost/...", ".php, com dois cliques no arquivo.", ".txt, pelo bloco de notas."], 1, "Extensão .php e acesso via servidor (localhost). Com dois cliques (file://), o PHP não é executado."], ["O que o comando <b>echo \"3\" . \"4\";</b> exibe?", ["7", "34", "3.4", "erro de sintaxe"], 1, "O ponto concatena strings: \"3\".\"4\" = \"34\". Soma seria com o operador + entre números: 3+4 = 7."], ["Uma página mostra a data de hoje diferente a cada acesso, mesmo sendo o mesmo arquivo. Isso acontece porque:", ["o navegador guarda datas aleatórias.", "o HTML foi recompilado.", "o PHP gera conteúdo dinâmico no servidor a cada requisição.", "o DNS altera o conteúdo enviado."], 2, "Conteúdo dinâmico: a cada requisição o servidor executa o PHP (ex.: date()) e gera um resultado atualizado."]]}, {"n": 7, "t": "PHP básico", "qs": [["Qual é a forma correta de declarar uma variável em PHP?", ["nome = \"Ana\";", "var nome = \"Ana\";", "$nome = \"Ana\";", "string $nome = \"Ana\";"], 2, "Variáveis em PHP começam com $ e não exigem declaração de tipo."], ["O comando var_dump($x) serve para:", ["apagar a variável $x.", "exibir o tipo e o valor da variável.", "somar todos os valores guardados.", "converter $x para string."], 1, "var_dump é a 'lupa' do programador: mostra tipo e valor, essencial para depurar."], ["Qual é o resultado de <b>10 % 3</b>?", ["3.33", "3", "1", "0"], 2, "% é o resto da divisão inteira: 10 ÷ 3 = 3 com resto 1."], ["O resultado de <b>5 === \"5\"</b> é:", ["true, pois os valores são iguais.", "false, pois os tipos são diferentes (integer × string).", "erro de sintaxe.", "a string \"5\"."], 1, "=== exige valor E tipo idênticos. Com ==, o resultado seria true."], ["A expressão <b>(true && false) || true</b> resulta em:", ["true", "false", "null", "erro"], 0, "true && false = false; false || true = true. Parênteses primeiro, depois o ||."]]}, {"n": 8, "t": "PHP – lógica (decisões)", "qs": [["O bloco de um <b>if</b> é executado quando:", ["a condição resulta em false.", "a condição resulta em true.", "sempre, independentemente da condição.", "apenas se houver um else."], 1, "if executa o bloco somente se a condição for verdadeira (true)."], ["Em uma cadeia if/elseif/else, quando uma condição elseif é verdadeira:", ["todos os blocos seguintes também executam.", "apenas o bloco dela executa e o restante da cadeia é ignorado.", "o programa gera um erro.", "o bloco do else executa junto."], 1, "O PHP executa apenas o primeiro bloco verdadeiro da cadeia e ignora os demais."], ["No programa da situação do aluno (>=7 aprovado; >=5 recuperação; else reprovado), qual é a saída para nota = 8?", ["RECUPERAÇÃO", "REPROVADO", "APROVADO", "APROVADO e RECUPERAÇÃO"], 2, "8 >= 7 é a primeira condição verdadeira → APROVADO. (Se a ordem estivesse invertida, cairia em recuperação — por isso a ordem importa.)"], ["A palavra-chave <b>break</b> dentro de um switch serve para:", ["reiniciar o switch.", "encerrar o switch, evitando que os cases seguintes executem.", "pular para o default.", "comparar o valor com o próximo case."], 1, "Sem o break, ocorre a cascata: os blocos dos cases seguintes executam mesmo sem bater."], ["O que está errado em <b>if ($nota = 7) { echo \"Aprovado\"; }</b>?", ["Falta o ponto e vírgula dentro do if.", "Deveria usar == ou === para comparar; = está atribuindo 7 à variável.", "A condição deveria estar sem parênteses.", "Nada: o código está correto."], 1, "= atribui (e o resultado 7 é 'verdadeiro'), então o bloco sempre executa. Comparação correta: == ou ===."]]}, {"n": 9, "t": "PHP – repetição e arrays", "qs": [["Quantas vezes o bloco executa em: <b>for ($i = 0; $i &lt; 5; $i++) { ... }</b>?", ["4 vezes", "5 vezes", "6 vezes", "infinitas vezes"], 1, "$i assume 0, 1, 2, 3, 4 → 5 voltas. Quando $i chega a 5, a condição $i < 5 falha."], ["O maior risco ao usar while é:", ["esquecer o ponto e vírgula do echo.", "criar um laço infinito por não atualizar a variável de controle.", "usar chaves no bloco.", "o laço nunca executar a primeira vez."], 1, "Sem o avanço ($contador++ ou similar), a condição nunca vira false e o laço não termina."], ["A diferença do do...while para o while é que o do...while:", ["só funciona com arrays.", "executa o bloco pelo menos uma vez, pois testa a condição no final.", "não precisa de condição.", "executa sempre duas vezes."], 1, "do...while = faz e depois confere: mínimo de 1 execução; while = confere e depois faz: pode executar 0 vezes."], ["Dado $frutas = [\"maçã\", \"banana\", \"uva\"], o comando <b>echo $frutas[1];</b> exibe:", ["maçã", "banana", "uva", "erro: índice fora do array"], 1, "Índices começam em 0: [0]=maçã, [1]=banana, [2]=uva."], ["Para percorrer todos os elementos de um array sem controlar índices manualmente, o laço ideal é:", ["for", "while", "foreach", "do...while"], 2, "foreach foi criado para arrays: foreach ($arr as $item). Com chave: as $k => $v."]]}, {"n": 10, "t": "PHP + HTML — organização, include e funções", "qs": [["A principal vantagem de usar include para o cabeçalho do site é:", ["a página carrega mais rápido no navegador.", "escrever o cabeçalho uma única vez e reutilizá-lo em todas as páginas.", "o Google indexa melhor o site.", "include adiciona estilos CSS automaticamente."], 1, "Reutilização e manutenção: mudar o cabeçalho em um único arquivo atualiza o site inteiro."], ["Qual a diferença entre include e require quando o arquivo não é encontrado?", ["Não há diferença.", "include gera erro fatal; require apenas avisa.", "require gera erro fatal (para a página); include emite warning e continua.", "require só funciona com arquivos PHP e include com HTML."], 2, "require = essencial (falhou, para tudo); include = opcional (falhou, avisa e segue)."], ["O que a função a seguir retorna? <b>function dobro($x) { $x * 2; }</b> (chamada: dobro(5))", ["10", "5", "0", "null — falta a palavra-chave return."], 3, "Sem return, a função não devolve nada (null). O correto: return $x * 2;"], ["Dado $alunos = [[\"nome\" => \"Ana\", \"nota\" => 9]], como acessar a nota da primeira aluna?", ["$alunos[\"nota\"]", "$alunos[0][\"nota\"]", "$alunos[1][\"nota\"]", "$alunos[0][0]"], 1, "Dois colchetes: posição na lista ([0]) + campo da ficha ([\"nota\"])."], ["Em uma página PHP que gera uma tabela com 50 produtos a partir de um array, as tags <tr>/<td> são escritas:", ["50 vezes, uma para cada produto.", "uma única vez dentro do foreach, que repete a linha para cada produto.", "no CSS, que monta a tabela.", "pelo navegador, automaticamente."], 1, "Geração dinâmica: o foreach repete o bloco HTML para cada item do array — o código não cresce com a quantidade de dados."]]}, {"n": 11, "t": "Formulários + PHP", "qs": [["Com method=\"get\", os dados do formulário são enviados:", ["no corpo da requisição, invisíveis.", "na URL, após o ?, no formato nome=valor.", "por e-mail automaticamente.", "em um arquivo temporário no servidor."], 1, "GET coloca os dados na URL (visíveis); POST os envia no corpo da requisição."], ["Para ler no PHP o campo <b>&lt;input name=\"email\"&gt;</b> enviado por POST, usamos:", ["$_GET[\"email\"]", "$_POST[\"email\"]", "$_FORM[\"email\"]", "$_EMAIL"], 1, "O método do form define a superglobal: method=post → $_POST; method=get → $_GET. A chave é o name do campo."], ["As funções isset() e empty() servem, respectivamente, para verificar se o dado:", ["é numérico e se é texto.", "foi enviado e se está vazio.", "está criptografado e se é seguro.", "é verdadeiro e se é falso."], 1, "isset = existe/foi enviado; empty = está vazio (\"\", 0, null, false). Juntas, formam a validação básica."], ["A função htmlspecialchars() protege a página porque:", ["criptografa a senha do usuário.", "impede o envio do formulário duas vezes.", "converte <, > e aspas em entidades — o dado vira texto, nunca código.", "valida se o e-mail digitado existe."], 2, "Sanitização de saída: neutraliza tags/scripts injetados (ataque XSS)."], ["Para um formulário de LOGIN (e-mail e senha), o método correto e o motivo são:", ["GET — porque é mais rápido.", "POST — porque os dados não ficam visíveis na URL nem no histórico.", "GET — porque a senha aparece criptografada na URL.", "Tanto faz: os dois são igualmente seguros para senhas."], 1, "Dados sensíveis (senha!) nunca por GET: ficariam visíveis na URL, no histórico e em logs. POST envia no corpo da requisição."]]}, {"n": 12, "t": "Projeto final integrador", "qs": [["A ordem recomendada de construção do projeto final é:", ["listagem → formulário → estrutura → includes.", "estrutura e includes → página inicial → cadastro → processamento → listagem.", "CSS → imagens → formulários → PHP.", "apresentação → código → testes."], 1, "Do alicerce ao acabamento: primeiro o esqueleto e o menu (navegável desde o início), depois as funcionalidades na ordem do fluxo de dados."], ["Um requisito bem escrito se caracteriza por ser:", ["curto e genérico, como ‘o sistema deve ser bom’.", "concreto e testável, como ‘a listagem exibe título, autor e disponibilidade em tabela’.", "escrito em inglês técnico.", "aprovado por todos os grupos da turma."], 1, "Requisito testável permite verificar sim/não na tabela de testes. Generalidades não orientam o desenvolvimento."], ["Na tabela de testes, além dos casos válidos e inválidos, os ‘testes de limite’ servem para:", ["testar o sistema em outros navegadores.", "verificar o comportamento exatamente nas bordas das regras (ex.: ano mínimo e máximo).", "medir a velocidade da página.", "testar apenas campos obrigatórios."], 1, "Erros se escondem nas bordas: valores exatamente no limite (1900/2026) ou logo fora (1899/2027) revelam condições mal escritas (>= vs >)."], ["A mensagem “Parse error: syntax error ... in listar.php on line 24” indica um erro de:", ["lógica — o resultado do cálculo está errado.", "execução — a variável não existe.", "sintaxe — o código viola as regras da linguagem; deve-se abrir o arquivo na linha indicada.", "segurança — dados não sanitizados."], 2, "Parse error = sintaxe. A mensagem dá arquivo e linha: estratégia ler → identificar → entender → corrigir → testar."], ["Na demonstração da apresentação final (aula 72), o roteiro prevê mostrar:", ["apenas a página inicial do sistema.", "somente o código-fonte completo, lido linha a linha.", "um cadastro válido, uma tentativa inválida com as mensagens de erro e a listagem dinâmica.", "um vídeo pronto, sem executar o sistema ao vivo."], 2, "A demonstração prova que o sistema funciona E que trata erros — os dois lados da validação. Plano B (vídeo) existe só para emergências."]]}], "provas": [{"id": "A1", "t": "Modelo A1 — Parte A (Web e HTML)", "qs": [["A Web (World Wide Web) é:", ["sinônimo de Internet.", "a infraestrutura física de cabos e servidores.", "um dos serviços que funcionam sobre a Internet, formado por páginas interligadas.", "um protocolo de criptografia de dados."], 2, "A Web é um serviço sobre a Internet; e-mail, streaming etc. são outros serviços."], ["Na URL https://loja.com.br/produtos/tv.php?cor=preta, o trecho “?cor=preta” é:", ["o protocolo.", "o domínio.", "o caminho.", "um parâmetro enviado à página."], 3, "Parâmetros vêm após ? no formato nome=valor."], ["A função do DNS é:", ["criptografar a conexão HTTPS.", "traduzir nomes de domínio em endereços IP.", "hospedar os arquivos do site.", "exibir as páginas no navegador."], 1, "DNS converte nome (loja.com.br) em IP do servidor."], ["Qual grupo tem apenas elementos HTML semânticos de formatação?", ["b, i, font", "strong, em, mark", "div, span, p", "table, tr, td"], 1, "strong/em/mark carregam significado; b/i são apenas aparência."], ["Para uma célula de tabela ocupar 2 colunas, usa-se:", ["rowspan=\"2\"", "colspan=\"2\"", "span=\"2\"", "merge=\"2\""], 1, "colspan mescla colunas; rowspan mesclaria linhas."], ["Em um formulário, o atributo que identifica o campo no processamento pelo servidor é:", ["id", "class", "name", "for"], 2, "name é a chave usada pelo PHP ($_POST/$_GET); id é para label/CSS."]]}, {"id": "A2", "t": "Modelo A2 — conceituais", "qs": [["Sobre HTML e PHP, é correto afirmar:", ["HTML é processado no servidor e PHP no navegador.", "HTML estrutura o conteúdo no navegador; PHP executa lógica no servidor e gera HTML.", "Ambos são linguagens de programação com variáveis e decisões.", "PHP substitui o HTML: páginas PHP não contêm HTML."], 1, "HTML = marcação interpretada no navegador; PHP = programação executada no servidor, que gera HTML como resposta."], ["Para enviar um formulário de cadastro com senha, o método e a leitura corretos são:", ["method=get, lido com $_GET — dados aparecem na URL.", "method=post, lido com $_POST — dados viajam no corpo da requisição.", "method=submit, lido com $_FORM.", "method=get, lido com $_POST."], 1, "Dados sensíveis (senha) → POST; o PHP lê no array $_POST pela chave name do campo."], ["O padrão seguro para receber dados de um formulário em PHP é:", ["usar $_POST diretamente no echo, sem verificações.", "confiar no required do HTML e dispensar validação no servidor.", "verificar com isset/empty, validar as regras e exibir com htmlspecialchars.", "criptografar a URL com GET."], 2, "Validação no servidor (isset/empty + regras) + sanitização na saída (htmlspecialchars) — required do HTML pode ser contornado."], ["Sobre include e funções, é correto afirmar:", ["include serve para reutilizar partes de página (ex.: cabeçalho); funções reutilizam lógica com parâmetros e retorno.", "include e function são sinônimos em PHP.", "funções não podem receber parâmetros.", "require emite apenas aviso se o arquivo não existir."], 0, "include/require reutilizam trechos de código/página; function define lógica nomeada com parâmetros e return. require gera erro FATAL se faltar o arquivo."]]}, {"id": "A3", "t": "Modelo A3 — conceituais", "qs": [["O ciclo de funcionamento da Web é:", ["resposta → requisição → processamento.", "requisição do navegador → processamento no servidor → resposta em HTML.", "processamento no navegador → requisição ao DNS → res const FORMAS = ["▲","◆","●","■"];
const K = "quizweb_Programacao_para_Internet_I";
const app = document.getElementById("app");
let st = null;          // estado da partida
let timerId = null;

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(K+k);
  localStorage.setItem(K+k, v); }catch(e){ return null; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- telas ---------------- */
function telaHome(){
  pararTimer();
  app.innerHTML = `
   <div class="grid-modos">
     <button class="modo solo" onclick="telaLista('aulas')">
       <h3>📘 Quiz por aula</h3>
       <p>${DATA.aulas.length} quizzes rápidos (3 questões cada). Ideal para revisar logo após cada aula.</p>
     </button>
     <button class="modo lista" onclick="telaLista('modulos')">
       <h3>⚡ Testes de módulo</h3>
       <p>Os 12 testes rápidos da apostila (5 questões cada) para fechar cada bloco.</p>
     </button>
     <button class="modo turma" onclick="telaLista('provas')">
       <h3>🏆 Desafios de prova</h3>
       <p>Questões objetivas dos modelos A1, A2 e A3 — treino para as avaliações.</p>
     </button>
   </div>
   <div class="card">
     <b>Como jogar</b>
     <p class="nota"><b>Modo Solo:</b> cada aluno joga no próprio celular/PC — cronômetro de 20 s,
     pontos por velocidade e sequência de acertos; explicação após cada questão.<br>
     <b>Modo Turma:</b> o professor projeta — cronômetro de 30 s, revela a resposta e marca
     pontos para as equipes (botões de +1). Sem necessidade de aparelho por aluno.<br>
     <b>Na tela de qualquer quiz há o botão “Modo Turma”.</b></p>
   </div>`;
}

function conjuntos(tipo){
  if (tipo === "aulas") return DATA.aulas.map(a => ({id:"a"+a.n, t:`Aula ${a.n} — ${a.t}`,
      sub:`Módulo ${a.mod}`, qs:a.qs}));
  if (tipo === "modulos") return DATA.modulos.map(m => ({id:"m"+m.n, t:`Módulo ${m.n} — ${m.t}`,
      sub:"Teste rápido", qs:m.qs}));
  return DATA.provas.map(p => ({id:"p"+p.id, t:p.t, sub:"Modelo de prova", qs:p.qs}));
}

function telaLista(tipo){
  pararTimer();
  const itens = conjuntos(tipo);
  const tit = {aulas:"Quiz por aula", modulos:"Testes rápidos de módulo", provas:"Desafios de prova"}[tipo];
  let html = `<h2 class="sec">${tit} <button class="btn secund" style="float:right" onclick="telaHome()">← Início</button></h2>`;
  if (tipo === "aulas"){
    let modAtual = 0;
    for (const it of itens){
      const mod = DATA.aulas.find(a => "a"+a.n === it.id).mod;
      if (mod !== modAtual){ modAtual = mod; html += `<h2 class="sec" style="font-size:15px;margin:16px 4px 6px">Módulo ${mod}</h2>`; }
      html += itemHtml(it);
    }
  } else {
    for (const it of itens) html += itemHtml(it);
  }
  app.innerHTML = html;
}
function itemHtml(it){
  const rec = store("rec_"+it.id);
  return `<div class="item-lista" onclick="iniciar('${it.id}', false)">
    <div><div class="tt">${esc(it.t)}</div><div class="sub">${it.qs.length} questões · ${esc(it.sub)}</div></div>
    <div class="badge ${rec? 'rec':''}">${rec ? "★ "+rec : "jogar"}</div></div>`;
}

function acharSet(id){
  for (const tipo of ["aulas","modulos","provas"])
    for (const c of conjuntos(tipo)) if (c.id === id) return c;
  return null;
}

/* ---------------- partida ---------------- */
function iniciar(id, turma){
  const set = acharSet(id);
  st = { set, i:0, pts:0, acertos:0, seq:0, resp:[], turma:!!turma,
         times: turma ? (st && st.times ? st.times : []) : [],
         tempo: turma ? 30 : 20, restante: turma ? 30 : 20, revelado:false, escolhido:-1 };
  if (turma && (!st.times || st.times.length === 0)) return telaTimes(id);
  rodar();
}

function telaTimes(id){
  pararTimer();
  app.innerHTML = `<h2 class="sec">Modo Turma — equipes</h2>
   <div class="card">
     <p style="font-size:15px;margin-bottom:10px"><b>${esc(acharSet(id).t)}</b></p>
     <p class="nota">Digite os nomes das equipes separados por vírgula (ou deixe vazio para jogar só com o cronômetro):</p>
     <div class="linha" style="margin-top:10px"><input type="text" id="inp-times" placeholder="Equipe A, Equipe B, Equipe C"></div>
     <div class="linha">
       <button class="btn" onclick="comecarTurma('${id}')">Começar ▶</button>
       <button class="btn secund" onclick="telaLista('aulas')">Voltar</button>
     </div>
   </div>`;
}
function comecarTurma(id){
  const v = document.getElementById("inp-times").value.trim();
  const nomes = v ? v.split(",").map(s => s.trim()).filter(Boolean).slice(0,6) : [];
  st = { set: acharSet(id), i:0, pts:0, acertos:0, seq:0, resp:[], turma:true,
         times: nomes.map(n => ({n, p:0})), tempo:30, restante:30, revelado:false, escolhido:-1 };
  rodar();
}

function rodar(){
  const q = st.set.qs[st.i];
  st.revelado = false; st.escolhido = -1; st.restante = st.tempo;
  let html = `<div class="barra-topo">
      <span>${esc(st.set.t)} · questão ${st.i+1}/${st.set.qs.length}</span>
      <span class="placar">${st.turma ? "" : `⭐ ${st.pts} pts` + (st.seq>=2?` · 🔥${st.seq}`:"")}</span>
      <span class="timerbox" id="tb">${st.restante}s</span>
    </div>
    <div class="timerbar"><i id="tbi"></i></div>
    <div class="${st.turma? 'turma':''}">
      <div class="pergunta">${esc(q[0])}</div>
      <div class="opcoes">
        ${q[1].map((a,k) => `<button class="op c${k}" id="op${k}" onclick="responder(${k})">
            <span class="forma">${FORMAS[k]}</span>${esc(a)}</button>`).join("")}
      </div>
    </div>
    <div id="fb"></div>
    <div class="linha" style="margin-top:14px">
      ${st.turma ? `<button class="btn amarelo" id="btnRev" onclick="revelar()">👁 Revelar resposta</button>` : ""}
      <button class="btn secund" id="btnNext" style="display:none" onclick="proxima()">Próxima ▶</button>
      <button class="btn secund" onclick="sair()">Sair</button>
      ${!st.turma ? `<button class="btn" onclick="iniciar('${st.set.id}', true)">📽 Modo Turma</button>` : ""}
    </div>
    ${st.turma && st.times.length ? `<div class="times" id="times">${st.times.map((t,k) =>
        `<button class="time" id="tm${k}" onclick="pontoTime(${k})">${esc(t.n)}<span>${t.p}</span></button>`).join("")}</div>
      <p class="nota">Após revelar, toque na equipe que acertou para dar +1 ponto.</p>` : ""}`;
  app.innerHTML = html;
  iniciarTimer();
}

function iniciarTimer(){
  pararTimer();
  const total = st.tempo;
  timerId = setInterval(() => {
    st.restante--;
    const tb = document.getElementById("tb"), tbi = document.getElementById("tbi");
    if (!tb) return pararTimer();
    tb.textContent = Math.max(0, st.restante) + "s";
    tbi.style.width = Math.max(0, 100 * st.restante / total) + "%";
    if (st.restante <= 0){ pararTimer(); if (!st.revelado) revelar(true); }
  }, 1000);
}
function pararTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }

function responder(k){
  if (st.revelado) return;
  st.escolhido = k;
  revelar(false, k);
}

function revelar(estourou, k){
  if (st.revelado) return;
  pararTimer();
  st.revelado = true;
  const q = st.set.qs[st.i];
  const certo = q[2];
  const escolha = (k === undefined) ? st.escolhido : k;
  for (let i = 0; i < 4; i++){
    const b = document.getElementById("op"+i);
    if (!b) continue;
    b.disabled = true;
    if (i === certo) b.classList.add("certa");
    else if (i === escolha) b.classList.add("errada");
  }
  let ganho = 0;
  if (!st.turma && escolha >= 0 && escolha === certo){
    ganho = 500 + Math.round(500 * Math.max(0, st.restante) / st.tempo) + Math.min(st.seq,5) * 100;
    st.seq++; st.pts += ganho; st.acertos++;
  } else if (!st.turma){ st.seq = 0; }
  st.resp.push({q: q[0], certo, escolha, ok: escolha === certo});
  const fb = document.getElementById("fb");
  if (st.turma){
    fb.innerHTML = `<div class="feedback ${estourou? 'erro':'ok'}">
      <b>${estourou ? "⏰ Tempo esgotado!" : "✅ Resposta: " + FORMAS[certo] + " — " + esc(q[1][certo])}</b>
      ${esc(q[3] || "")}</div>`;
  } else {
    fb.innerHTML = escolha === certo
      ? `<div class="feedback ok"><b>✔ Acertou! +${ganho} pts</b>${esc(q[3] || "")}</div>`
      : `<div class="feedback erro"><b>${estourou? "⏰ Tempo esgotado!" : "✘ Não foi dessa vez…" }
         Resposta: ${FORMAS[certo]} — ${esc(q[1][certo])}</b>${esc(q[3] || "")}</div>`;
  }
  document.getElementById("btnNext").style.display = "inline-block";
  const br = document.getElementById("btnRev"); if (br) br.style.display = "none";
  const pl = document.querySelector(".placar");
  if (pl && !st.turma) pl.innerHTML = `⭐ ${st.pts} pts` + (st.seq>=2?` · 🔥${st.seq}`:"");
}

function pontoTime(k){
  if (!st.revelado || !st.times.length) return;
  st.times[k].p++;
  const b = document.getElementById("tm"+k);
  if (b) b.querySelector("span").textContent = st.times[k].p;
}

function proxima(){
  st.i++;
  if (st.i >= st.set.qs.length) return fim();
  rodar();
}

function fim(){
  pararTimer();
  const total = st.set.qs.length;
  if (!st.turma){
    const rec = parseInt(store("rec_"+st.set.id) || "0", 10);
    if (st.pts > rec) store("rec_"+st.set.id, String(st.pts));
    let rev = st.resp.map((r, i) => `<div class="rev ${r.ok? 'ok':'erro'}">
        <b>${i+1}. ${r.ok? "✔":"✘"} ${esc(r.q)}</b><br>
        Resposta: ${esc(st.set.qs[i][1][st.set.qs[i][2]])}</div>`).join("");
    app.innerHTML = `<div class="card podio">
        <div class="p1">${st.acertos === total ? "🏆" : st.acertos >= total/2 ? "🎉" : "💪"}</div>
        <h2 style="color:var(--roxo);font-size:26px;margin:6px 0">${st.pts} pontos</h2>
        <p style="font-size:16px">${st.acertos} de ${total} acertos · ${esc(st.set.t)}</p>
        ${st.pts >= rec && st.pts > 0 ? '<p class="nota" style="color:var(--verde);font-weight:700">★ Novo recorde!</p>' : ""}
        <div class="linha" style="justify-content:center;margin-top:14px">
          <button class="btn" onclick="iniciar('${st.set.id}', false)">🔁 Jogar de novo</button>
          <button class="btn secund" onclick="telaLista('aulas')">Lista</button>
          <button class="btn secund" onclick="telaHome()">Início</button>
        </div></div>
        <h2 class="sec">Revisão das questões</h2>${rev}`;
  } else {
    const ordenados = [...st.times].sort((a,b) => b.p - a.p);
    const medalhas = ["🥇","🥈","","4º","5º","6º"];
    app.innerHTML = `<div class="card podio">
        <div class="p1">🏁</div><h2 style="color:var(--roxo);font-size:26px;margin:6px 0">Fim de jogo!</h2>
        <p style="font-size:15px">${esc(st.set.t)} · ${total} questões</p>
        ${ordenados.length ? ordenados.map((t,i) =>
            `<div class="rev ${i===0? 'ok':''}" style="font-size:17px"><b>${medalhas[i]} ${esc(t.n)} — ${t.p} pts</b></div>`).join("")
          : `<p class="nota">Sem equipes cadastradas — o placar foi acompanhado oralmente pelo professor. 😄</p>`}
        <div class="linha" style="justify-content:center;margin-top:14px">
          <button class="btn" onclick="iniciar('${st.set.id}', true)">🔁 Outra rodada</button>
          <button class="btn secund" onclick="telaHome()">Início</button>
        </div></div>`;
  }
}

function sair(){ pararTimer(); telaHome(); }

telaHome();
</script>
</body>
</html>
